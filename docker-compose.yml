version: '3.8'

services:
  web:
    build: .  # Uses your Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app  # Sync local code for development
    ports:
      - "8000:8000"
    env_file:
      - .env  # Load all variables (DB_NAME, DB_USER, etc.) from here
    environment:
      - DB_HOST=host.docker.internal  # Critical: Connects to host's Postgres
    restart: unless-stopped
