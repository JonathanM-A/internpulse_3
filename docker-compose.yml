version: '3.8'

services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .  # Uses your Dockerfile
    user: root 
    command: >
      sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app  # Sync local code for development
      - static_volume:/app/staticfiles
    ports:
      - "80:8000"
    env_file:
      - .env  # Load all variables (DB_NAME, DB_USER, etc.) from here
    environment:
      - DB_HOST=db  # Changed from host.docker.internal to db
      - DB_NAME=appdb
      - DB_USER=user
      - DB_PASSWORD=pass
    depends_on:
      - db  # Ensures db starts before web
    restart: unless-stopped

volumes:
  pgdata:
  static_volume: